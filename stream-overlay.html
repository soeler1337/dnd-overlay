<!DOCTYPE html>
<!--
  DnD Overlay - Stream Overlay
  ============================
  In OBS als Browser-Quelle hinzufuegen:
    URL:    https://soeler1337.github.io/dnd-overlay/stream-overlay.html?game=5570639
    Breite: 1920, Hoehe: 1080
    Hintergrund: transparent (Haken setzen)

  Der game= Parameter muss die DnD Beyond Game-ID sein.
  Ein-/Ausblenden einfach ueber OBS (Quelle sichtbar/unsichtbar).

  Lokal testen im Browser:
    https://soeler1337.github.io/dnd-overlay/stream-overlay.html?game=5570639
    (file:// funktioniert nicht wegen CORS-Beschraenkungen)
-->
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>DnD Stream Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
    }

    #overlay-root {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* -- Hintergrundbild -- */
    #bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    #bg.visible { opacity: var(--bg-opacity, 1); }

    /* -- Wetter-GIF -- */
    #weather {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: repeat;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    #weather.visible { opacity: 0.6; }

    /* -- Handout Mirror (zentriert, mit Backdrop) -- */
    #handout-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.65);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #handout-wrap.visible { opacity: 1; }

    #handout-frame {
      max-width: 75%;
      max-height: 80%;
      display: flex;
      flex-direction: column;
      border: 2px solid #c8a45a;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 16px 60px rgba(0,0,0,0.9);
    }

    #handout-title {
      background: linear-gradient(180deg, #271c08, #1e1508);
      color: #c8a45a;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 9px 16px;
      border-bottom: 1px solid #c8a45a44;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #handout-img {
      display: block;
      max-width: 100%;
      max-height: calc(80vh - 40px);
      object-fit: contain;
      background: #0e0b06;
    }

    /* -- Portrait-Slot (rechts unten) -- */
    #portrait {
      position: absolute;
      right: 60px;
      bottom: 60px;
      width: 280px;
      height: 360px;
      border-radius: 8px;
      border: 2px solid #c8a45a;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      background-size: cover;
      background-position: center top;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #portrait.visible { opacity: 1; transform: translateY(0); }

    /* =====================================================
       Wuerfellog – unten links
       ===================================================== */
    #dice-log {
      position: absolute;
      left: 48px;
      bottom: 48px;
      width: 320px;
      display: flex;
      flex-direction: column-reverse; /* newest at bottom */
      gap: 8px;
    }

    .dice-entry {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, rgba(14,11,6,0.92) 0%, rgba(22,18,10,0.88) 100%);
      border: 1px solid #c8a45a44;
      border-left: 3px solid #c8a45a;
      border-radius: 6px;
      padding: 8px 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
      animation: dice-slide-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .dice-entry.nat20 {
      border-left-color: #f0d060;
      background: linear-gradient(135deg, rgba(20,14,2,0.95) 0%, rgba(28,20,4,0.92) 100%);
      box-shadow: 0 4px 24px rgba(200,164,90,0.35);
    }

    .dice-entry.fading {
      animation: dice-fade-out 0.5s ease forwards;
    }

    @keyframes dice-slide-in {
      from { opacity: 0; transform: translateX(-24px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes dice-fade-out {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(-16px); }
    }

    .dice-total {
      font-size: 32px;
      font-weight: 800;
      color: #c8a45a;
      line-height: 1;
      min-width: 44px;
      text-align: center;
      letter-spacing: -1px;
      flex-shrink: 0;
    }

    .dice-entry.nat20 .dice-total {
      color: #f0d060;
      text-shadow: 0 0 12px #f0d06088;
    }

    .dice-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .dice-player {
      font-size: 11px;
      font-weight: 700;
      color: #c8a45a;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dice-entry.nat20 .dice-player {
      color: #f0d060;
    }

    .dice-label {
      font-size: 12px;
      color: #9a8a6a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dice-nat-badge {
      font-size: 10px;
      font-weight: 800;
      color: #f0d060;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div id="overlay-root">
  <div id="bg"></div>
  <div id="weather"></div>
  <div id="handout-wrap">
    <div id="handout-frame">
      <div id="handout-title"></div>
      <img id="handout-img" src="" alt="" />
    </div>
  </div>
  <div id="portrait"></div>
  <div id="dice-log"></div>
</div>

<script src="extension/lib/supabase.umd.js"></script>
<script>
  const SUPABASE_URL      = 'https://oeypwacjlbgpcwobvxix.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9leXB3YWNqbGJncGN3b2J2eGl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NDM2MjUsImV4cCI6MjA5NjMxOTYyNX0.Z1NEjmnE_OHdOzlQ1ChFfbU6epVtVzCDmLQu86dvjJ0';

  const gameId = new URLSearchParams(location.search).get('game') || '5570639';

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false },
  });

  const bgEl        = document.getElementById('bg');
  const wxEl        = document.getElementById('weather');
  const handoutWrap = document.getElementById('handout-wrap');
  const handoutImg  = document.getElementById('handout-img');
  const handoutTitle= document.getElementById('handout-title');
  const portEl      = document.getElementById('portrait');
  const diceLog     = document.getElementById('dice-log');

  // Max visible dice entries
  const DICE_MAX    = 5;
  // Auto-remove after this many ms (0 = never)
  const DICE_TTL_MS = 18000;

  let currentScene = null;

  // ------------------------------------------------------------------
  // Scene / weather / handout helpers
  // ------------------------------------------------------------------
  function applyScene(scene, isCombat) {
    currentScene = scene;
    if (!scene?.background_url || isCombat) { bgEl.classList.remove('visible'); return; }
    const opacity = scene.bg_opacity > 0 ? 1 : 0;
    bgEl.style.backgroundImage = `url(${JSON.stringify(scene.background_url)})`;
    bgEl.style.setProperty('--bg-opacity', opacity);
    bgEl.classList.toggle('visible', opacity > 0);
  }

  function applyWeather(preset, isCombat) {
    if (isCombat || !preset?.gif_url) { wxEl.classList.remove('visible'); return; }
    wxEl.style.backgroundImage = `url(${JSON.stringify(preset.gif_url)})`;
    wxEl.classList.add('visible');
  }

  function applyHandout(url, title) {
    if (!url) { handoutWrap.classList.remove('visible'); return; }
    handoutTitle.textContent = title || '';
    handoutImg.src = url;
    handoutWrap.classList.add('visible');
  }

  function showPortrait(url) {
    if (!url) { portEl.classList.remove('visible'); return; }
    portEl.style.backgroundImage = `url(${JSON.stringify(url)})`;
    portEl.classList.add('visible');
  }

  // ------------------------------------------------------------------
  // Dice log helpers
  // ------------------------------------------------------------------
  function addDiceEntry(roll) {
    // Remove oldest if at max
    while (diceLog.children.length >= DICE_MAX) {
      removeDiceEntry(diceLog.lastElementChild);
    }

    const entry = document.createElement('div');
    entry.className = 'dice-entry' + (roll.is_nat20 ? ' nat20' : '');

    const totalStr = roll.total != null ? String(roll.total) : '?';
    const player   = roll.player_name  || '';
    const label    = roll.roll_label   || '';

    entry.innerHTML =
      '<div class="dice-total">' + esc(totalStr) + '</div>' +
      '<div class="dice-info">' +
        (player ? '<div class="dice-player">' + esc(player) + '</div>' : '') +
        (roll.is_nat20 ? '<div class="dice-nat-badge">&#x2605; Nat 20!</div>' : '') +
        (label  ? '<div class="dice-label">'  + esc(label)  + '</div>' : '') +
      '</div>';

    diceLog.prepend(entry);

    if (DICE_TTL_MS > 0) {
      setTimeout(() => removeDiceEntry(entry), DICE_TTL_MS);
    }
  }

  function removeDiceEntry(el) {
    if (!el || !el.parentNode) return;
    el.classList.add('fading');
    el.addEventListener('animationend', () => el.remove(), { once: true });
  }

  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ------------------------------------------------------------------
  // Init
  // ------------------------------------------------------------------
  async function init() {
    const { data: campaign } = await sb
      .from('campaigns').select('id').eq('game_id', gameId).single();
    if (!campaign) { console.error('Keine Kampagne fuer game=' + gameId); return; }

    const campaignId = campaign.id;

    // Load recent dice rolls (last 5) so overlay isn't empty on page load
    const { data: recentRolls } = await sb
      .from('dice_rolls')
      .select('*')
      .eq('campaign_id', campaignId)
      .order('created_at', { ascending: false })
      .limit(DICE_MAX);
    if (recentRolls) {
      // Add oldest first so newest ends up at bottom
      [...recentRolls].reverse().forEach(r => addDiceEntry(r));
    }

    const { data: session } = await sb
      .from('sessions')
      .select('id, active_scene_id, is_combat, stream_handout_url, stream_handout_title')
      .eq('campaign_id', campaignId)
      .single();
    if (!session) { console.error('Keine Session gefunden'); return; }

    applyHandout(session.stream_handout_url, session.stream_handout_title);

    if (session.active_scene_id) {
      const { data: scene } = await sb
        .from('scenes').select('*').eq('id', session.active_scene_id).single();
      if (scene) applyScene(scene, session.is_combat);
    }

    // Main channel: session + scene updates
    sb.channel('stream-' + session.id)
      .on('postgres_changes', {
        event: 'UPDATE', schema: 'public', table: 'sessions',
        filter: 'id=eq.' + session.id,
      }, async (payload) => {
        const s = payload.new;
        applyHandout(s.stream_handout_url, s.stream_handout_title);

        if (s.active_scene_id) {
          const { data: scene } = await sb
            .from('scenes').select('*').eq('id', s.active_scene_id).single();
          if (scene) {
            applyScene(scene, !!s.is_combat);
            if (scene.weather_preset_id) {
              const { data: preset } = await sb
                .from('weather_presets').select('*').eq('id', scene.weather_preset_id).single();
              applyWeather(preset, !!s.is_combat);
            } else {
              applyWeather(null, false);
            }
          }
        }
      })
      .on('postgres_changes', {
        event: 'UPDATE', schema: 'public', table: 'scenes',
        filter: 'campaign_id=eq.' + campaignId,
      }, (payload) => {
        if (currentScene && payload.new.id === currentScene.id) {
          applyScene(payload.new, false);
        }
      })
      .subscribe();

    // Dice channel: new roll inserts
    sb.channel('dice-' + campaignId)
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'dice_rolls',
        filter: 'campaign_id=eq.' + campaignId,
      }, (payload) => {
        addDiceEntry(payload.new);
      })
      .subscribe();
  }

  init().catch(e => console.error('Stream Overlay Fehler:', e));
</script>
</body>
</html>
